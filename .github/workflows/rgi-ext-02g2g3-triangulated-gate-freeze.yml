name: RGI EXT 02G2G3 TRIANGULATED AVAILABILITY GATE FREEZE
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
jobs:
  triangulated-gate-static-freeze:
    if: github.event.pull_request.head.ref == 'rgi-ext-02g2g3-triangulated-carrier-availability-gate-20260820'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify prospective triangulated gate without RunPod access
        run: |
          test -z "${RUNPOD_API:-}"
          test ! -e evidence
          python3 rgi-ext-02g2b/schema_contract_test.py
          python3 rgi-ext-02g2b/verify_repair_freeze.py
          python3 rgi-ext-02g2c/verify_fresh_measurement_authorization.py
          python3 rgi-ext-02g2e/verify_funded_replacement_freeze.py
          python3 rgi-ext-02g2g3/verify_triangulated_gate.py
          python3 -m py_compile rgi-ext-02g2g3/triangulated_watch_and_execute.py rgi-ext-02g2g3/verify_triangulated_gate.py
