name: RGI EXT 02G2C FRESH MEASUREMENT AUTHORIZATION PREFLIGHT
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  static-authorization-preflight:
    if: github.event.pull_request.head.ref == 'rgi-ext-02g2c-fresh-measurement-authorization-freeze-20260819'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Final source/config preflight only; no GPU or provider execution
        run: |
          test -z "${RUNPOD_API:-}"
          test ! -e evidence
          python3 rgi-ext-02g2b/schema_contract_test.py
          python3 rgi-ext-02g2b/verify_repair_freeze.py
          python3 rgi-ext-02g2c/verify_fresh_measurement_authorization.py
          python3 -m py_compile rgi-ext-02g2/gpu_measurement_point.py rgi-ext-02g2b/schema_contract_test.py rgi-ext-02g2b/verify_repair_freeze.py rgi-ext-02g2c/verify_fresh_measurement_authorization.py
