name: RGI EXT 02G2E FUNDED PREOBSERVATION REPLACEMENT FREEZE
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  funded-replacement-static-preflight:
    if: github.event.pull_request.head.ref == 'rgi-ext-02g2e-funded-preobservation-replacement-freeze-20260820'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Zero-cost preflight only; no provider create request
        run: |
          test -z "${RUNPOD_API:-}"
          test ! -e evidence
          python3 rgi-ext-02g2b/schema_contract_test.py
          python3 rgi-ext-02g2b/verify_repair_freeze.py
          python3 rgi-ext-02g2c/verify_fresh_measurement_authorization.py
          python3 rgi-ext-02g2e/verify_funded_replacement_freeze.py
          python3 -m py_compile rgi-ext-02g2/measurement_executor.py rgi-ext-02g2a/measurement_executor_equiv.py rgi-ext-02g2e/verify_funded_replacement_freeze.py
