name: RGI EXT 02G2F FUNDED FRESH MEASUREMENT ONE SHOT
on:
  pull_request:
    types: [opened]
permissions:
  contents: read
jobs:
  one-shot-funded-fresh-measurement:
    if: github.event.pull_request.head.ref == 'rgi-ext-02g2f-funded-fresh-measurement-exec-20260820'
    runs-on: ubuntu-24.04
    env:
      RUNPOD_API: ${{ secrets.RUNPOD_API }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify all zero-cost gates before provider request
        run: |
          test ! -e evidence
          python3 rgi-ext-02g2b/schema_contract_test.py
          python3 rgi-ext-02g2b/verify_repair_freeze.py
          python3 rgi-ext-02g2c/verify_fresh_measurement_authorization.py
          python3 rgi-ext-02g2e/verify_funded_replacement_freeze.py
          python3 rgi-ext-02g2f/verify_execution_identity.py
          python3 -m py_compile rgi-ext-02g2/gpu_measurement_point.py rgi-ext-02g2/measurement_executor.py rgi-ext-02g2a/measurement_executor_equiv.py rgi-ext-02g2f/verify_execution_identity.py
      - name: Execute exactly one funded provider request and frozen measurement path
        run: bash rgi-ext-02g2f/run_funded_fresh_measurement.sh
      - name: Surface terminal evidence
        if: always()
        run: |
          if [ -f evidence/EQUIVALENCE_CERTIFICATE.json ]; then jq '{state,carrier_class_id,all_checks_passed,certificate_sha256}' evidence/EQUIVALENCE_CERTIFICATE.json; fi
          if [ -f evidence/PREDICTION_SEAL.json ]; then jq '{alpha:.alpha.alpha_hat,beta_hat,theta_hat,theta_ci95,class,measurement_points_executed,seal_sha256}' evidence/PREDICTION_SEAL.json; fi
          if [ -f evidence/TERMINAL_RECEIPT.json ]; then jq '{terminal_state,stage,completed_at_ns,receipt_sha256}' evidence/TERMINAL_RECEIPT.json; fi
          if [ -f evidence/runpod_delete_http_status.txt ]; then printf 'RUNPOD_DELETE_HTTP='; cat evidence/runpod_delete_http_status.txt; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rgi-ext-02g2f-funded-fresh-measurement-evidence
          path: evidence/
          if-no-files-found: warn
