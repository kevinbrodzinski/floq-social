name: RGI EXT 02G2A CARRIER EQUIVALENCE FREEZE
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  freeze-carrier-equivalence-amendment:
    if: github.event.pull_request.head.ref == 'rgi-ext-02g2a-gpu-carrier-equivalence-20260819'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify prospective amendment before any GPU provisioning
        run: |
          python3 rgi-ext-02g2a/verify_amendment.py
          test "$(grep -R "RUNPOD_API" -n .github/workflows/rgi-ext-02g2a-freeze.yml || true)" = ""
      - name: Freeze hashes
        run: |
          sha256sum \
            rgi-ext-02g2a/CARRIER_EQUIVALENCE_AMENDMENT.json \
            rgi-ext-02g2a/CARRIER_EQUIVALENCE_AMENDMENT.md \
            rgi-ext-02g2a/verify_amendment.py | tee RGI_EXT_02G2A_FREEZE_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rgi-ext-02g2a-carrier-equivalence-freeze
          path: RGI_EXT_02G2A_FREEZE_SHA256.txt
